name: Build APK

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RECONNAISSANCE_KEYSTORE_B64: ${{ secrets.RECONNAISSANCE_KEYSTORE_B64 }}
      RECONNAISSANCE_KEYSTORE_PASSWORD: ${{ secrets.RECONNAISSANCE_KEYSTORE_PASSWORD }}
      RECONNAISSANCE_KEY_ALIAS: ${{ secrets.RECONNAISSANCE_KEY_ALIAS }}
      RECONNAISSANCE_KEY_PASSWORD: ${{ secrets.RECONNAISSANCE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK 35
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$ANDROID_HOME" -name sdkmanager -type f 2>/dev/null | head -1)
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.1"

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      # Comme notes-de-frais : "0 tests found" sort aussi en 0, ce qui ferait un faux vert.
      - name: Assert unit tests actually ran
        run: |
          python3 - <<'PY'
          import glob, sys, xml.etree.ElementTree as ET
          files = glob.glob('app/build/test-results/**/*.xml', recursive=True)
          total = sum(int(ET.parse(f).getroot().get('tests', 0)) for f in files)
          print(f'{len(files)} classe(s) de test, {total} test(s) unitaires')
          if total < 20:
              sys.exit(f'Trop peu de tests exécutés ({total})')
          PY

      - name: Build signed release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Verify signature
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | tail -1)
          "$BT/apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk | head -5
          if [ -z "$RECONNAISSANCE_KEYSTORE_B64" ]; then
            echo "::warning::Secrets de signature absents : APK signé avec une clé de debug jetable, la mise à jour par-dessus échouera. Lancer scripts/push-secrets.sh."
          fi

      - name: Version
        id: version
        run: echo "VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: reconnaissance-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      # Release roulante "latest" lue par la mise à jour intégrée (même schéma que notes-de-frais) :
      # app-release.apk + version.json, plus reconnaissance.apk pour le lien direct.
      - name: Publish "latest" release
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          VER: ${{ steps.version.outputs.VERSION }}
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          cp "$APK" "$RUNNER_TEMP/reconnaissance.apk"
          # Créée une fois, puis les fichiers sont remplacés sur place : le lien ne renvoie jamais 404.
          gh release view latest >/dev/null 2>&1 || \
            gh release create latest --target "${{ github.sha }}" --title "Reconnaissance v${VER}" --notes "Build automatique - v${VER}"
          gh release edit latest --title "Reconnaissance v${VER}" --notes "Build automatique - v${VER}"
          for f in "$APK" "$RUNNER_TEMP/reconnaissance.apk"; do
            for i in 1 2 3 4 5; do
              gh release upload latest "$f" --clobber && break
              sleep 10
            done
          done
          # Publié après l'APK : le manifeste n'annonce jamais un build dont le fichier n'est pas en ligne.
          printf '{"version":"%s","notes":"Build automatique - v%s","apk":"%s"}\n' \
            "$VER" "$VER" \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/latest/app-release.apk" \
            > "$RUNNER_TEMP/version.json"
          for i in 1 2 3 4 5; do
            gh release upload latest "$RUNNER_TEMP/version.json" --clobber && break
            sleep 10
          done
          # Un ancien APK laissé dans la release roulante ferait installer une vieille version.
          gh release view latest --json assets -q '.assets[].name' \
            | grep -vx -e 'app-release.apk' -e 'reconnaissance.apk' -e 'version.json' \
            | while read -r stale; do gh release delete-asset latest "$stale" -y || true; done
